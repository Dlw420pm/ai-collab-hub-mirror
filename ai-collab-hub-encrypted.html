const te = new TextEncoder(), td = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const p = JSON.parse(atob(PAYLOAD));
  const keyMat = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.salt), iterations:p.iter, hash:"SHA-256"},
    keyMat, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, key, b64(p.ct));
  return td.decode(pt);
}
async function go(){
  const pw = document.getElementById("pw").value, err = document.getElementById("err");
  err.textContent = "";
  if(!pw){ err.textContent = "Type the password first."; return; }
  try {
    const html = await unlock(pw);
    document.open(); document.write(html); document.close();
  } catch(e){ err.textContent = "Wrong password. Try again."; }
}
document.getElementById("go").onclick = go;
document.getElementById("pw").addEventListener("keydown", e => { if(e.key === "Enter") go(); });
document.getElementById("pw").focus();
